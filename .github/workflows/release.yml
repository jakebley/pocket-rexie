name: Release to TestFlight

# Manual, and only from main. Needs the four repository secrets listed in docs/RELEASE.md.
# Not exercised in this repository's CI because it requires Apple credentials. The unsigned archive
# and its checks ARE exercised by release-dry-run.yml.
on:
  workflow_dispatch:

concurrency:
  group: testflight-release
  cancel-in-progress: false

jobs:
  testflight:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
    steps:
      - name: Refuse to run outside main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "::error::Release only runs from main (this is $GITHUB_REF)"; exit 1; fi
      - uses: actions/checkout@v4
      - name: Check secrets are present
        run: |
          for v in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret for $v (APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64; see docs/RELEASE.md)"; exit 1; fi
          done
          if ! echo "$TEAM_ID" | grep -Eq '^[A-Z0-9]{10}$'; then echo "::error::APPLE_TEAM_ID must be the 10-character Team ID"; exit 1; fi
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)" || true
          xcodebuild -version
      - run: brew install xcodegen
      - name: Build number
        run: |
          # Offset keeps it above 0 and above any manual test upload; run_number is unique per workflow.
          BUILD=$((100 + ${{ github.run_number }}))
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          echo "Build number: $BUILD"
          if [ "${{ github.run_attempt }}" != "1" ]; then echo "::warning::Re-run of a run: App Store Connect rejects a build number it already has. If the first attempt uploaded, start a new run instead."; fi
      - run: xcodegen generate
      - name: Write the App Store Connect API key
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" || { echo "::error::ASC_KEY_P8_BASE64 did not decode to a .p8 key (re-create it with: base64 -i AuthKey_XXXX.p8)"; exit 1; }
      - name: Archive (signing is managed by Xcode through the API key)
        run: |
          set -o pipefail
          xcodebuild archive -project PocketRexie.xcodeproj -scheme PocketRexie \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PocketRexie.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee archive.log | tail -n 40
      - name: Check the archive (icons, privacy manifests, versions, bundle ids)
        run: set -o pipefail; python3 tools/verify_archive.py "$RUNNER_TEMP/PocketRexie.xcarchive" "$BUILD_NUMBER" | tee verify.log
      - name: Export and upload to App Store Connect
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/PocketRexie.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log | tail -n 40
      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
      - name: Summary
        if: always()
        run: |
          {
            echo "### Release to TestFlight"
            echo "- Version: $(grep -m1 MARKETING_VERSION project.yml | tr -d ' \"') , build $BUILD_NUMBER"
            if [ "${{ job.status }}" = "success" ]; then
              echo "- Uploaded. The build shows in App Store Connect, TestFlight tab, after Apple finishes processing (usually 5 to 30 minutes). Internal testers get it once you enable it."
            else
              echo "- FAILED. Download the \`release-logs\` artifact (archive.log, export.log, verify.log). See docs/RELEASE.md, section If something fails."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Surface errors
        if: failure()
        run: grep -h "error:" archive.log export.log 2>/dev/null | sort -u | head -9 | cut -c1-900 | while IFS= read -r l; do echo "::error title=release::${l//%/%25}"; done || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-logs
          path: |
            archive.log
            export.log
            verify.log
