name: Release dry run

# Proves the TestFlight archive can be built and is well formed, without any Apple credentials:
# unsigned Release archive of the iPhone app (embeds widget, watch app, watch widget) plus static checks.
on:
  workflow_dispatch:
  push:
    paths:
      - project.yml
      - config/**
      - Shared/**
      - iOS/**
      - Watch/**
      - Widget/**
      - tools/verify_archive.py
      - .github/workflows/release-dry-run.yml

concurrency:
  group: dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    name: Unsigned Release archive and checks
    runs-on: macos-15
    timeout-minutes: 45
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)" || true
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Archive iPhone app in Release (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive -project PocketRexie.xcodeproj -scheme PocketRexie \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PocketRexie.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" 2>&1 | tee archive.log | tail -n 40
      - name: Show archive contents
        if: always()
        run: |
          find "$RUNNER_TEMP/PocketRexie.xcarchive" -maxdepth 6 \( -name "*.app" -o -name "*.appex" -o -name Info.plist -o -name PrivacyInfo.xcprivacy -o -name Assets.car \) | sort || true
      - name: Verify archive
        run: set -o pipefail; python3 tools/verify_archive.py "$RUNNER_TEMP/PocketRexie.xcarchive" "$BUILD_NUMBER" | tee verify.log
      - name: Verify Release code has no test-only symbols
        run: |
          set -e
          # RENDER_TESTS may only be set for the unit-test target.
          awk '/^  PocketRexie(Widget|Watch|WatchWidget)?:/{t=1} /^  PocketRexieTests:/{t=0} t && /RENDER_TESTS/{print "RENDER_TESTS set outside the tests target"; bad=1} END{exit bad}' project.yml
          echo "RENDER_TESTS only in the tests target"
      - name: Summary
        if: always()
        run: |
          {
            echo "### Release dry run (build $BUILD_NUMBER)"
            echo '```'
            tail -n 40 verify.log 2>/dev/null || echo "no verification output (archive failed?)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Surface errors
        if: failure()
        run: grep -h "error:" archive.log | sort -u | head -9 | cut -c1-900 | while IFS= read -r l; do echo "::error title=archive::${l//%/%25}"; done || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dry-run-logs
          path: |
            archive.log
            verify.log
