name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Engine, generators, web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: expo-prototype/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx tsx test/sim.ts
      - name: Generated files are up to date
        working-directory: .
        run: |
          python3 tools/gen_swift.py
          python3 tools/gen_ts.py
          git diff --exit-code -- Shared/SpeciesData.swift expo-prototype/src/core/speciesData.ts
      - run: npx expo export --platform web

  apple:
    name: Build iOS, widget and watch
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)" || true
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build iPhone app (embeds widget and watch app)
        run: |
          set -o pipefail
          xcodebuild -project PocketRexie.xcodeproj -scheme PocketRexie \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM= build 2>&1 | tee build-ios.log | tail -n 60
      - name: Build watch app
        run: |
          set -o pipefail
          xcodebuild -project PocketRexie.xcodeproj -scheme PocketRexieWatch \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM= build 2>&1 | tee build-watch.log | tail -n 60
      - name: Collect errors
        if: failure()
        run: grep -h -E "error:" build-*.log | sort -u | head -80 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: build-*.log
