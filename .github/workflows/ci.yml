name: CI

on:
  push:
    branches-ignore: [ci-screenshots]
  pull_request:

jobs:
  web:
    name: Engine, generators, web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: expo-prototype/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm test
      - name: Generated files are up to date
        working-directory: .
        run: |
          python3 tools/gen_swift.py
          python3 tools/gen_ts.py
          git diff --exit-code -- Shared/SpeciesData.swift expo-prototype/src/core/speciesData.ts
      - run: npx expo export --platform web
      - name: Native JS bundles (Hermes) build
        run: npx expo export --platform ios --platform android --output-dir /tmp/native-export

  apple:
    name: Build iOS, widget and watch
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)" || true
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build iPhone app (embeds widget and watch app)
        run: |
          set -o pipefail
          xcodebuild -project PocketRexie.xcodeproj -scheme PocketRexie \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM= build 2>&1 | tee build-ios.log | tail -n 60
      - name: Unit tests (game engine)
        run: |
          set -o pipefail
          xcodebuild -project PocketRexie.xcodeproj -scheme PocketRexie \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM= test 2>&1 | tee test-ios.log | tail -n 80
      - name: Report test results
        run: |
          summary=$(grep -E "Executed [0-9]+ tests" test-ios.log | tail -1)
          echo "::notice title=XCTest::${summary}"
          n=$(echo "$summary" | sed -E 's/.*Executed ([0-9]+) tests.*/\1/')
          test "${n:-0}" -ge 10
      - name: Build watch app
        run: |
          set -o pipefail
          xcodebuild -project PocketRexie.xcodeproj -scheme PocketRexieWatch \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM= build 2>&1 | tee build-watch.log | tail -n 60
      - name: Collect errors
        if: failure()
        run: grep -h -E "error:" build-*.log | sort -u | head -80 || true
      - name: Surface errors as annotations
        if: failure()
        run: |
          grep -h -E "error:|Test Case .* failed|XCTAssert" build-*.log test-*.log 2>/dev/null | sort -u | head -9 | cut -c1-900 \
            | while IFS= read -r line; do echo "::error title=apple-log::${line//%/%25}"; done || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            build-*.log
            test-*.log

  render:
    name: Render UI screenshots
    if: github.event_name == 'push' && github.ref != 'refs/heads/ci-screenshots'
    runs-on: macos-15
    permissions:
      contents: write
    concurrency:
      group: publish-renders
      cancel-in-progress: false
    env:
      RENDER_DIR: ${{ github.workspace }}/render-out
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)" || true
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Pick simulator
        run: |
          xcrun simctl list devices available | grep -E "iPhone|iOS" | head -30
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in sorted(d.items()) if 'iOS' in k for x in v if x['name'].startswith('iPhone') and x['isAvailable']]
          pref=[x for x in c if x['name']=='iPhone 16'] or c
          print(pref[-1]['udid'])
          ")
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
      - name: Render views to PNG
        env:
          TEST_RUNNER_RENDER_OUT: ${{ env.RENDER_DIR }}
        run: |
          set -o pipefail
          mkdir -p "$RENDER_DIR"
          xcodebuild -project PocketRexie.xcodeproj -scheme PocketRexie \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -only-testing:PocketRexieTests/UIRenderTests \
            CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM= test 2>&1 | tee render-test.log | tail -n 60
      - name: Surface errors as annotations
        if: failure()
        run: |
          grep -E "error:|Executed [0-9]+ tests|failed|xcodebuild: error" render-test.log | sort -u | head -9 | cut -c1-900 \
            | while IFS= read -r line; do echo "::error title=render-log::${line//%/%25}"; done || true
          tail -n 3 render-test.log | cut -c1-500 | while IFS= read -r line; do echo "::warning title=render-tail::${line//%/%25}"; done || true
      - name: Count renders
        if: always()
        run: |
          n=$(find "$RENDER_DIR" -name '*.png' | wc -l | tr -d ' ')
          echo "::notice title=Renders::${n} PNG files written"
      - name: Publish to ci-screenshots
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          short=$(git rev-parse --short=8 HEAD)
          url="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          rm -rf pub
          if git ls-remote --exit-code --heads "$url" ci-screenshots >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch ci-screenshots "$url" pub
          else
            mkdir pub
            git -C pub init --quiet
          fi
          cd pub
          mkdir -p renders
          rm -rf "renders/${short}"
          mkdir -p "renders/${short}"
          cp -R "$RENDER_DIR"/. "renders/${short}/"
          echo "${GITHUB_REF_NAME} ${short}" > "renders/${short}/BRANCH.txt"
          # Keep only the latest 2 shas: index.txt is ordered oldest to newest.
          touch renders/index.txt
          grep -v -x "$short" renders/index.txt > renders/index.new || true
          echo "$short" >> renders/index.new
          mv renders/index.new renders/index.txt
          total=$(wc -l < renders/index.txt | tr -d ' ')
          if [ "$total" -gt 2 ]; then
            head -n $((total - 2)) renders/index.txt | while read -r old; do rm -rf "renders/${old}"; done
            tail -n 2 renders/index.txt > renders/index.new && mv renders/index.new renders/index.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --quiet --orphan ci-screenshots-new
          git add -A
          git commit --quiet -m "Renders for ${short} (${GITHUB_REF_NAME})"
          git push --force "$url" ci-screenshots-new:refs/heads/ci-screenshots

  uitest:
    name: UI tests (XCUITest on two simulators)
    if: github.event_name == 'push' && github.ref != 'refs/heads/ci-screenshots'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RESULTS_DIR: ${{ github.workspace }}/uitest-results
      UI_SHOTS_DIR: /tmp/ui-shots
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)" || true
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Pick simulators
        run: |
          xcrun simctl list devices available | grep -E "iPhone|iOS" | head -60
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, re, subprocess
          d = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))["devices"]
          phones = []
          for runtime, devs in sorted(d.items()):
              if "iOS" not in runtime:
                  continue
              for x in devs:
                  if x["name"].startswith("iPhone") and x.get("isAvailable", True):
                      phones.append(x)

          def find(*names):
              for n in names:
                  hit = [x for x in phones if x["name"] == n]
                  if hit:
                      return hit[-1]
              return None

          def gen(x):
              m = re.search(r"iPhone (\d+)", x["name"])
              return int(m.group(1)) if m else 0

          small = find("iPhone SE (3rd generation)", "iPhone SE (2nd generation)", "iPhone 13 mini",
                       "iPhone 12 mini", "iPhone 16e", "iPhone 16", "iPhone 15")
          pros = sorted([x for x in phones if re.search(r"Pro$", x["name"])], key=gen)
          pro = find("iPhone 16 Pro") or (pros[-1] if pros else None)
          small = small or phones[0]
          pro = pro or phones[-1]
          print("SIM_SMALL_UDID=" + small["udid"])
          print("SIM_SMALL_NAME=" + small["name"])
          print("SIM_PRO_UDID=" + pro["udid"])
          print("SIM_PRO_NAME=" + pro["name"])
          PY
          echo "small: $SIM_SMALL_NAME  pro: $SIM_PRO_NAME" || true
      - name: Build for testing
        id: build
        run: |
          set -o pipefail
          xcodebuild -project PocketRexie.xcodeproj -scheme PocketRexieUITests \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM= build-for-testing 2>&1 | tee uitest-build.log | tail -n 60
      - name: Run UI tests (small iPhone)
        id: small
        run: |
          echo "::notice title=uitest device::small iPhone is ${SIM_SMALL_NAME}"
          bash .github/scripts/run_uitests.sh "$SIM_SMALL_NAME" "$SIM_SMALL_UDID"
      - name: Run UI tests (Pro iPhone)
        id: pro
        if: always() && steps.build.outcome == 'success'
        run: |
          echo "::notice title=uitest device::Pro iPhone is ${SIM_PRO_NAME}"
          bash .github/scripts/run_uitests.sh "$SIM_PRO_NAME" "$SIM_PRO_UDID"
      - name: Surface build errors as annotations
        if: failure() && steps.build.outcome == 'failure'
        run: |
          grep -h -E "error:" uitest-build.log | sort -u | head -9 | cut -c1-900 \
            | while IFS= read -r line; do echo "::error title=uitest-build::${line//%/%25}"; done || true
      - name: Count screenshots
        if: always()
        run: |
          n=$(find /tmp/ui-shots -name '*.png' 2>/dev/null | wc -l | tr -d ' ')
          echo "::notice title=UI screenshots::${n} PNG files written"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uitest-results
          path: |
            uitest-results
            uitest-*.log
      - name: Publish to ci-screenshots
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          short=$(git rev-parse --short=8 HEAD)
          url="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          for attempt in 1 2 3 4 5 6; do
            rm -rf pub
            if git ls-remote --exit-code --heads "$url" ci-screenshots >/dev/null 2>&1; then
              git clone --quiet --depth 1 --branch ci-screenshots "$url" pub
              base=$(git -C pub rev-parse HEAD)
            else
              mkdir pub
              git -C pub init --quiet
              base=""
            fi
            (
              set -e
              cd pub
              mkdir -p uitests
              rm -rf "uitests/${short}"
              mkdir -p "uitests/${short}"
              if [ -d /tmp/ui-shots ]; then cp -R /tmp/ui-shots/. "uitests/${short}/"; fi
              echo "${GITHUB_REF_NAME} ${short}" > "uitests/${short}/BRANCH.txt"
              touch uitests/index.txt
              grep -v -x "$short" uitests/index.txt > uitests/index.new || true
              echo "$short" >> uitests/index.new
              mv uitests/index.new uitests/index.txt
              total=$(wc -l < uitests/index.txt | tr -d ' ')
              if [ "$total" -gt 2 ]; then
                head -n $((total - 2)) uitests/index.txt | while read -r old; do rm -rf "uitests/${old}"; done
                tail -n 2 uitests/index.txt > uitests/index.new && mv uitests/index.new uitests/index.txt
              fi
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git checkout --quiet --orphan ci-screenshots-new
              git add -A
              git commit --quiet -m "UI test screenshots for ${short} (${GITHUB_REF_NAME})"
            ) || { echo "prepare failed"; sleep 5; continue; }
            if [ -n "$base" ]; then
              git -C pub push "$url" ci-screenshots-new:refs/heads/ci-screenshots \
                --force-with-lease="refs/heads/ci-screenshots:${base}" && break
            else
              git -C pub push "$url" ci-screenshots-new:refs/heads/ci-screenshots && break
            fi
            echo "push raced with another publisher, retrying (${attempt})"
            sleep $((attempt * 4))
          done
