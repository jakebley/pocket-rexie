name: PocketRexie
options:
  bundleIdPrefix: com.pocketrexie
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    # Replace with your Apple Developer Team ID (10 characters), or set it in Xcode.
    DEVELOPMENT_TEAM: "REPLACE_WITH_YOUR_TEAM_ID"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  PocketRexie:
    type: application
    platform: iOS
    sources:
      - iOS
      - Shared
      - path: config/privacy/iOS
        buildPhase: resources
    dependencies:
      - target: PocketRexieWidget
        embed: true
      - target: PocketRexieWatch
        embed: true
    entitlements:
      path: config/iOS.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketrexie.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: config/Info-iOS.plist
      properties:
        CFBundleDisplayName: Pocket Rexie
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: []
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.pocketrexie.app
            CFBundleURLSchemes: [pocketrexie]

  PocketRexieWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
      - path: config/privacy/Widget
        buildPhase: resources
    entitlements:
      path: config/Widget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketrexie.app.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    info:
      path: config/Info-Widget.plist
      properties:
        CFBundleDisplayName: Pocket Rexie
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  PocketRexieWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - Shared
      - path: config/privacy/Watch
        buildPhase: resources
    dependencies:
      - target: PocketRexieWatchWidget
        embed: true
    entitlements:
      path: config/Watch.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketrexie.app.watchkitapp
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: config/Info-Watch.plist
      properties:
        CFBundleDisplayName: Pocket Rexie
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.pocketrexie.app
        WKRunsIndependentlyOfCompanionApp: true
        UIBackgroundModes: []
        CFBundleURLTypes:
          - CFBundleURLName: com.pocketrexie.app.watchkitapp
            CFBundleURLSchemes: [pocketrexie]

  PocketRexieWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - Widget
      - Shared
      - path: config/privacy/WatchWidget
        buildPhase: resources
    entitlements:
      path: config/WatchWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketrexie.app.watchkitapp.widget
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
    info:
      path: config/Info-WatchWidget.plist
      properties:
        CFBundleDisplayName: Pocket Rexie
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  PocketRexieTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - Shared/Pet.swift
      - Shared/Species.swift
      - Shared/SpeciesData.swift
      - Shared/Sprites.swift
      - Shared/LivingScene.swift
      - Shared/SceneGlyphs.swift
      - Shared/SceneRenderer.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketrexie.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PocketRexie:
    build:
      targets:
        PocketRexie: all
    test:
      config: Debug
      targets:
        - PocketRexieTests
    run:
      config: Debug
    archive:
      config: Release
  PocketRexieWatch:
    build:
      targets:
        PocketRexieWatch: all
    run:
      config: Debug
    archive:
      config: Release
