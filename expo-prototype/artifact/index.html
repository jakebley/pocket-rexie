<title>Pocket Rexie</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: the whole page is the toy, centered at phone width on any screen. */
  :root { --ground: #B5C19A; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --ground: #1E2418; } }
  html, body { height: 100%; touch-action: manipulation; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  input, textarea { -webkit-user-select: text; user-select: text; }
  body {
    margin: 0;
    background: var(--ground);
    overflow: hidden;
    box-sizing: border-box;
  }
  #root { display: flex; height: 100%; flex: 1; }
</style>
<div id="root"></div>
<noscript>Pocket Rexie needs JavaScript.</noscript>
<script src="app.js" defer></script>
